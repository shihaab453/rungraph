[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runevidence-tensorboard"
version = "0.1.1"
description = "RunEvidence adapter for TensorBoard event files: one run per .tfevents file, every supported scalar as a locator result."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shihaab Alam" }]
keywords = ["machine-learning", "reproducibility", "provenance", "tensorboard", "runevidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Reads TensorBoard's event files with the core reader; TensorBoard itself is
# not needed and neither is TensorFlow, protobuf or google-crc32c.
dependencies = ["runevidence>=0.1.1,<0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# This line is what makes `runevidence init --adapter tensorboard` work:
# RunEvidence looks up adapters in the "runevidence.adapters" entry point group.
[project.entry-points."runevidence.adapters"]
tensorboard = "runevidence_tensorboard:TensorboardAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/runevidence_tensorboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
