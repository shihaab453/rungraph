[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runevidence-hydra"
version = "0.1.0"
description = "RunEvidence adapter for experiment folders written by Hydra (outputs/, multirun/ and .hydra/)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shihaab Alam" }]
keywords = ["machine-learning", "reproducibility", "provenance", "hydra", "runevidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Reads Hydra's output files; Hydra itself is not needed. PyYAML is the only
# addition, and Hydra installs already include it.
dependencies = ["runevidence>=0.1.0", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# This line is what makes `runevidence init --adapter hydra` work: RunEvidence
# looks up adapters in the "runevidence.adapters" entry point group.
[project.entry-points."runevidence.adapters"]
hydra = "runevidence_hydra:HydraAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/runevidence_hydra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
